        if(!file) return;
        if(file.size > 2*1024*1024){ toast(t('fileTooLargeToast')); myCvFileInput.value=''; return; }
        const nameElBusy = document.getElementById('elk-my-cv-filename');
        if(nameElBusy) nameElBusy.textContent = '⏳ আপলোড হচ্ছে...';
        try{
          const url = await fileToUploadedRawUrl(file, 'cvs');
          const hidden = document.getElementById('elk-my-cv-hidden');
          const nameHidden = document.getElementById('elk-my-cv-filename-hidden');
          const nameEl = document.getElementById('elk-my-cv-filename');
          if(hidden) hidden.value = url;
          if(nameHidden) nameHidden.value = file.name;
          if(nameEl) nameEl.textContent = t('cvSelectedPrefix') + file.name;
        }catch(e){ toast(t('toastFillRequired')); if(nameElBusy) nameElBusy.textContent = ''; }
      };
    }

    const myListingForm = document.getElementById('elk-my-listing-form');
    if(myListingForm){
      myListingForm.onsubmit = async (e)=>{
        e.preventDefault();
        const fd = new FormData(myListingForm);
        const data = {
          category: fd.get('category'), name:(fd.get('name')||'').trim(),
          bizType: isFixedPlaceCat(fd.get('category')) ? 'physical' : (fd.get('bizType')==='online' ? 'online' : 'physical'),
          country:(fd.get('country')||'').trim(), district:(fd.get('district')||'').trim(), area:(fd.get('area')||'').trim(),
          mapQuery:(fd.get('mapQuery')||'').trim(),
          phone:(fd.get('phone')||'').trim(), whatsapp:(fd.get('whatsapp')||'').trim(), facebook:(fd.get('facebook')||'').trim(),
          subjects:(fd.get('subjects')||'').trim(),
          roomRate:(fd.get('roomRate')||'').trim(),
          vehicleType:(fd.get('vehicleType')||'').trim(),
          skills:(fd.get('skills')||'').trim(),
          cvUrl:(fd.get('cvUrl')||'').trim(), cvFileName:(fd.get('cvFileName')||'').trim(),
          bloodGroup: fd.get('bloodGroup')||'', lastDonation: fd.get('lastDonation')||'',
          description:(fd.get('description')||'').trim(), photoUrl:(fd.get('photoUrl')||'').trim(),
        };
        if(!data.name || !data.country || !data.district || !data.area){ toast(t('toastFillRequired')); return; }
        if(!data.phone && !data.whatsapp && !data.facebook){ toast(t('toastNeedContact')); return; }
        if(!fd.get('noAdultConfirm')){ toast(t('toastMustConfirm')); return; }
        // added: block opening a second profile/business with the exact same name
        // in the exact same country+district+area (blood donors are exempt, since
        // several people can genuinely share a name and still each want to register).
        if(data.category !== 'donor'){
          const norm = s => (s||'').trim().toLowerCase();
          const isDuplicate = state.listings.some(x=>
            x.id !== state.editingMyListingId &&
            x.category !== 'donor' &&
            norm(x.name)===norm(data.name) &&
            norm(x.country)===norm(data.country) &&
            norm(x.district)===norm(data.district) &&
            norm(x.area)===norm(data.area)
          );
          if(isDuplicate){ toast(t('toastDuplicateName')); return; }
        }
        if(data.photoUrl){
          state.checkingSafety = true; render();
          const flagged = await isImageAdult(data.photoUrl);
          state.checkingSafety = false;
          if(flagged){ render(); toast(t('imageBlockedToast')); return; }
        }
        let newListingId = null;
        try{
          if(state.editingMyListingId){
            const { error } = await sb.from('listings').update(listingObjToRow(data)).eq('id', state.editingMyListingId).eq('owner_id', state.deviceId);
            if(error) throw error;
            const l = state.listings.find(x=>x.id===state.editingMyListingId && x.ownerDeviceId===state.deviceId);
            if(l) Object.assign(l, data, {updatedAt: Date.now()});
          } else {
            const { data: inserted, error } = await sb.from('listings').insert(listingObjToRow(data)).select().single();
            if(error) throw error;
            newListingId = inserted.id;
            state.listings.unshift(Object.assign(listingRowToObj(inserted), {products:[]}));
          }
        }catch(err){ toast(t('toastRefreshFailed')); return; }
        if(data.country && data.district && data.area) registerLocation(data.country, data.district, data.area);
        // Donor/worker/teacher profiles are people, not shops — they don't sell
        // products, so there's nothing useful in the "Products & Videos" screen
        // for them. Sending them there anyway is what made creating a donor
        // profile look like it was dumping them into "My Business". Only real
        // shop/service listings get routed into that screen.
        const isPersonCat = (data.category==='worker' || data.category==='donor' || data.category==='teacher');
        if(newListingId && !isPersonCat){
          // fresh shop/service profile: go straight into "Products & Videos" so
          // the person can immediately post photos/videos buyers will see.
          state.myShopView='products'; state.productListingId=newListingId; state.editingProductId=null;
        } else {
          state.myShopView='list';
          // a brand-new donor profile almost always came from the "রক্তদাতা
          // হিসেবে প্রোফাইল খুলুন" button on the Blood tab — take them back
          // there instead of leaving them sitting in My Business.
          if(newListingId && data.category==='donor') state.tab='blood';
        }
        state.editingMyListingId=null;
        render();
        toast(t('toastSaved'));
      };
    }

    const productMediaTypeSel = document.getElementById('elk-product-mediatype');
    const productPickBtn = document.getElementById('elk-product-pick-btn');
    const productFileInput = document.getElementById('elk-product-file');
    if(productMediaTypeSel && productPickBtn && productFileInput){
      const syncAccept = ()=>{
        const isVideo = productMediaTypeSel.value==='video';
        productFileInput.setAttribute('accept', isVideo ? 'video/*' : 'image/*');
        productPickBtn.textContent = isVideo ? t('chooseVideoBtn') : t('chooseImageBtn');
      };
      productMediaTypeSel.onchange = syncAccept; syncAccept();
      productPickBtn.onclick = ()=> productFileInput.click();
      productFileInput.onchange = async ()=>{
        const file = productFileInput.files && productFileInput.files[0];
        if(!file) return;
        const isVideo = productMediaTypeSel.value==='video';
        const maxBytes = isVideo ? 3*1024*1024 : 8*1024*1024;
        if(file.size > maxBytes){ toast(isVideo ? t('chatMediaTooLarge') : t('fileTooLargeToast')); productFileInput.value=''; return; }
        const prevLabel = productPickBtn.textContent;
        productPickBtn.disabled = true; productPickBtn.textContent = '⏳ আপলোড হচ্ছে...';
        try{
          const url = isVideo ? await fileToUploadedRawUrl(file, 'product-media') : await fileToUploadedImageUrl(file, 'product-media', 900, 0.72);
          const hidden = document.getElementById('elk-product-media-hidden');
          const preview = document.getElementById('elk-product-media-preview');
          if(hidden) hidden.value = url;
          if(preview){
            preview.style.display = '';
            preview.innerHTML = isVideo
              ? `<video src="${url}" controls style="width:100%;max-height:180px;border-radius:8px;"></video>`
              : `<img src="${url}" style="width:100%;max-height:180px;object-fit:cover;border-radius:8px;">`;
          }
        }catch(e){ toast(t('toastFillRequired')); }
        finally{ productPickBtn.disabled = false; productPickBtn.textContent = prevLabel; }
      };
    }
    // added: pick many photos/videos from the gallery at once and add them all
    // as new products, keeping everything that was posted before.
    const productBulkBtn = document.getElementById('elk-product-bulk-add-btn');
    const productBulkFile = document.getElementById('elk-product-bulk-file');
    if(productBulkBtn && productBulkFile){
      productBulkBtn.onclick = ()=> productBulkFile.click();
      productBulkFile.onchange = async ()=>{
        const files = Array.from(productBulkFile.files || []);
        productBulkFile.value = '';
        if(!files.length) return;
        const l = state.listings.find(x=>x.id===state.productListingId && x.ownerDeviceId===state.deviceId);
        if(!l) return;
        l.products = l.products || [];
        state.checkingSafety = true; render();
        let added = 0, skipped = 0;
        for(const file of files){
          const isVideo = file.type.startsWith('video/');
          const maxBytes = isVideo ? 3*1024*1024 : 8*1024*1024;
          if(file.size > maxBytes){ skipped++; continue; }
          try{
            const url = isVideo ? await fileToUploadedRawUrl(file, 'product-media') : await fileToUploadedImageUrl(file, 'product-media', 900, 0.72);
            if(!isVideo){
              const flagged = await isImageAdult(url);
              if(flagged){ skipped++; continue; }
            }
            const { data: inserted, error } = await sb.from('products').insert({
              listing_id: l.id, media_type: isVideo?'video':'image', media_url: url, price:'', caption:'',
            }).select().single();
            if(error) throw error;
            l.products.push(productRowToObj(inserted));
            added++;
          }catch(e){ skipped++; }
        }
        state.checkingSafety = false;
        render();
        if(added && skipped) toast(t('toastBulkAddedSomeSkipped', {n: String(added), s: String(skipped)}));
        else if(added) toast(t('toastBulkAdded', {n: String(added)}));
        else toast(t('imageBlockedToast'));
      };
    }
    const productClearAllBtn = document.getElementById('elk-product-clear-all-btn');
    if(productClearAllBtn){
      productClearAllBtn.onclick = async ()=>{
        const l = state.listings.find(x=>x.id===state.productListingId && x.ownerDeviceId===state.deviceId);
        if(!l || !(l.products||[]).length) return;
        if(!confirm(t('confirmClearAllProducts'))) return;
        try{ await sb.from('products').delete().eq('listing_id', l.id); }
        catch(e){ toast(t('toastRefreshFailed')); return; }
        l.products = [];
        state.editingProductId = null;
        render();
        toast(t('toastAllCleared'));
      };
    }
    const productForm = document.getElementById('elk-product-form');
    if(productForm){
      productForm.onsubmit = async (e)=>{
        e.preventDefault();
        const l = state.listings.find(x=>x.id===state.productListingId && x.ownerDeviceId===state.deviceId);
        if(!l) return;
        const fd = new FormData(productForm);
        const mediaUrl = (fd.get('mediaUrl')||'').trim();
        if(!mediaUrl){ toast(t('productMediaRequired')); return; }
        if(!fd.get('noAdultConfirm')){ toast(t('toastMustConfirm')); return; }
        const mediaType = fd.get('mediaType')||'image';
        const editingId = (fd.get('editingProductId')||'').trim();
        const existing = editingId ? (l.products||[]).find(p=>p.id===editingId) : null;
        if(mediaType==='image' && mediaUrl !== (existing && existing.mediaUrl)){
          state.checkingSafety = true; render();
          const flagged = await isImageAdult(mediaUrl);
          state.checkingSafety = false;
          if(flagged){ render(); toast(t('imageBlockedToast')); return; }
        }
        const fields = { mediaType, mediaUrl, price: (fd.get('price')||'').trim(), caption: (fd.get('caption')||'').trim() };
        const row = { media_type: fields.mediaType, media_url: fields.mediaUrl, price: fields.price, caption: fields.caption };
        l.products = l.products || [];
        try{
          if(existing){
            const { error } = await sb.from('products').update(row).eq('id', existing.id);
            if(error) throw error;
            Object.assign(existing, fields, {updatedAt: Date.now()});
          } else {
            const { data: inserted, error } = await sb.from('products').insert(Object.assign({listing_id: l.id}, row)).select().single();
            if(error) throw error;
            l.products.push(productRowToObj(inserted));
          }
        }catch(err){ toast(t('toastRefreshFailed')); return; }
        state.editingProductId = null;
        render();
        toast(existing ? t('toastSaved') : t('toastProductAdded'));
      };
    }
    const productCancelEdit = document.getElementById('elk-product-cancel-edit');
    if(productCancelEdit) productCancelEdit.onclick = ()=>{ state.editingProductId = null; render(); };
    document.querySelectorAll('[data-edit-product]').forEach(b=>{
      b.onclick = ()=>{ state.editingProductId = b.dataset.editProduct; render(); };
    });
    document.querySelectorAll('[data-del-product]').forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm(t('confirmDeleteProduct'))) return;
        const l = state.listings.find(x=>x.id===state.productListingId && x.ownerDeviceId===state.deviceId);
        if(!l) return;
        try{ await sb.from('products').delete().eq('id', b.dataset.delProduct); }
        catch(e){ toast(t('toastRefreshFailed')); return; }
        l.products = (l.products||[]).filter(p=>p.id!==b.dataset.delProduct);
        if(state.editingProductId===b.dataset.delProduct) state.editingProductId = null;
        render();
        toast(t('toastProductDeleted'));
      };
    });

    const msgOwnerBtn = document.getElementById('elk-msg-owner-btn');
    if(msgOwnerBtn) msgOwnerBtn.onclick = ()=>{ openChat(msgOwnerBtn.dataset.msgListing, state.deviceId); };

    const prodSearchInput = document.getElementById('elk-prod-search-input');
    const prodSearchGo = document.getElementById('elk-prod-search-go');
    if(prodSearchInput){ autoGrowTextarea(prodSearchInput); prodSearchInput.oninput = e=>{ state.productSearchQuery = e.target.value; autoGrowTextarea(prodSearchInput); }; }
    const runProdSearch = async ()=>{
      const listingId = prodSearchGo ? prodSearchGo.dataset.listing : null;
      const l = state.listings.find(x=>x.id===listingId);
      const q = (state.productSearchQuery||'').trim();
      if(!l || !q) return;
      const match = searchProductInListing(l, q);
      if(match){
        state.productSearchResult = {listingId: l.id, productId: match.id};
        render();
        const card = document.querySelector(`.elk-product-card[data-product-id="${match.id}"]`);
        if(card) card.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
      } else {
        state.productSearchResult = {listingId: l.id, productId: null};
        render();
        await logDemand(l.id, q);
      }
    };
    if(prodSearchGo) prodSearchGo.onclick = runProdSearch;
    if(prodSearchInput) prodSearchInput.onkeydown = e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); runProdSearch(); } };
    const askAboutBtn = document.getElementById('elk-ask-about-btn');
    if(askAboutBtn) askAboutBtn.onclick = ()=>{
      const l = state.listings.find(x=>x.id===askAboutBtn.dataset.listing);
      const p = l && (l.products||[]).find(x=>x.id===askAboutBtn.dataset.product);
      if(l && p) askAboutProduct(l.id, p);
    };

    const chatBackdrop = document.getElementById('elk-chat-backdrop');
    if(chatBackdrop) chatBackdrop.onclick = ()=>{ state.modal=null; state.chatPendingMedia=null; render(); };
    const chatClose = document.getElementById('elk-chat-close');
    if(chatClose) chatClose.onclick = ()=>{ state.modal=null; state.chatPendingMedia=null; render(); };
    const chatAttachBtn = document.getElementById('elk-chat-attach-btn');
    const chatFileInput = document.getElementById('elk-chat-file');
    if(chatAttachBtn && chatFileInput){
      chatAttachBtn.onclick = ()=> chatFileInput.click();
      chatFileInput.onchange = async ()=>{
        const file = chatFileInput.files && chatFileInput.files[0];
        if(!file) return;
        const isVideo = file.type.startsWith('video/');
        const maxBytes = isVideo ? 3*1024*1024 : 8*1024*1024;
        if(file.size > maxBytes){ toast(t('chatMediaTooLarge')); chatFileInput.value=''; return; }
        state.checkingSafety = true; render();
        try{
          const url = isVideo ? await fileToUploadedRawUrl(file, 'chat-media') : await fileToUploadedImageUrl(file, 'chat-media', 900, 0.72);
          state.chatPendingMedia = { type: isVideo?'video':'image', dataUrl: url };
        }catch(e){ toast(t('toastFillRequired')); }
        finally{ state.checkingSafety = false; render(); }
      };
    }
    const chatRemoveMedia = document.getElementById('elk-chat-remove-media');
    if(chatRemoveMedia) chatRemoveMedia.onclick = ()=>{ state.chatPendingMedia=null; render(); };
    const chatForm = document.getElementById('elk-chat-form');
    if(chatForm){
      chatForm.onsubmit = async (e)=>{
        e.preventDefault();
        const input = chatForm.querySelector('[name="msg"]');
        const text = input.value;
        input.value = '';
        const pending = state.chatPendingMedia;
        if(pending && pending.type==='image'){
          state.checkingSafety = true; render();
          const flagged = await isImageAdult(pending.dataUrl);
          state.checkingSafety = false;
          if(flagged){ state.chatPendingMedia=null; render(); toast(t('imageBlockedToast')); return; }
        }
        state.chatPendingMedia = null;
        await sendChatMessage(text, pending && pending.type==='image' ? pending.dataUrl : '', pending && pending.type==='video' ? pending.dataUrl : '');
        render();
        const thread = document.getElementById('elk-chat-thread');
        if(thread) thread.scrollTop = thread.scrollHeight;
      };
    }
  }

  ensureAuth();

  // background auto-refresh so new admin entries appear without a manual reload
  setInterval(()=>{
    if(document.hidden) return; // tab not visible, skip
    if(state.modal) return; // a modal (e.g. password, import) is open, don't disturb it
    if(state.tab==='myshop' && state.myShopView==='form') return; // don't wipe an in-progress form
    refreshData(true);
  }, 45000);
})();
</script>
</body>
</html>
